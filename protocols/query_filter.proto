syntax = "proto3";
package cashmere;

// 过滤类型
enum QueryFilterType {
  // 匹配
  MATCH = 0;
  // 大于
  GREATER_THAN = 1;
  // 大于等于
  GREATER_THAN_OR_EQUAL = 2;
  // 小于
  LESS_THAN = 3;
  // 小于等于
  LESS_THAN_OR_EQUAL = 4;
  // 在数组中
  IN = 5;
  // 不在数组中
  NOT_IN = 6;
  // 匹配数组中的所有元素
  ALL = 10;
  // 等于
  EQUAL = 7;
  // 不等于
  NOT_EQUAL = 8;
  // 字段存在
  EXISTS = 9;
}

// 查询条件
// 只支持固定的几种条件, 对应
message QueryCondition{
  // 排序条件
  map <string, bool> order_by = 1; // key: 字段名, value: true: 升序, false: 降序
  // 实体过滤条件 
  map <string, string> filter = 2; // key: 字段名, value: 字段值
  map<string, QueryFilter> query_filter = 3; // key: 字段名, value: 过滤条件
}

message QueryFilter {
  // 字段
  string field_id = 1;
  // 类型
  QueryFilterType filter_type = 2;
  //  bson {"value": value}
  bytes value = 3;
}

// 排序
message OrderBy {
  // 字段
  string field = 1;
  //  true: 升序, false: 降序
  bool asc = 2;
}

